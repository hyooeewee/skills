name: Continuous Translation

# Sync upstream, translate docs to zh, open/update a PR to main.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY_URL: ${{ vars.UPSTREAM_REPOSITORY_URL }}
  UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH || 'main' }}
  # Files re-imported from our repo (not translated, not from upstream).
  KEEP_FROM_ORIGIN: ".github translations .ctignore"

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      doc: ${{ steps.sync.outputs.doc }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPOSITORY_URL"
          git fetch upstream "$UPSTREAM_BRANCH" --no-tags
      - name: Detect changes
        id: sync
        run: |
          if git diff --quiet "upstream/$UPSTREAM_BRANCH" origin/main; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes. Exiting." && exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --name-only "upstream/$UPSTREAM_BRANCH" origin/main > /tmp/changed.txt
          # Not markdown -> sync raw; markdown -> translation candidates.
          grep -v -E '\.md$' /tmp/changed.txt |
            grep -v -E '^\.github/|^\.changeset/|^CHANGELOG\.md$|^translations/' |
            sort -u > /tmp/non_doc.txt || true
          grep -E '\.md$' /tmp/changed.txt | sort -u > /tmp/doc.txt || true
          echo "doc=$(wc -l < /tmp/doc.txt)" >> "$GITHUB_OUTPUT"
          cat /tmp/non_doc.txt
          cat /tmp/doc.txt

  translation:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPOSITORY_URL"
          git fetch upstream "$UPSTREAM_BRANCH" --no-tags
      # Prepare content on the origin/main worktree WITHOUT creating the PR branch:
      # a pre-created branch tracking upstream breaks create-pull-request.
      - name: Prepare content from upstream
        run: |
          # Resolve the workspace workflow files from our repo, not upstream, so
          # upstream's release workflow never enters the branch.
          git checkout "upstream/$UPSTREAM_BRANCH" -- . ':!.github/workflows'
          # Delete files removed upstream.
          git ls-tree -r --name-only origin/main | while read -r f; do
            git cat-file -e "upstream/$UPSTREAM_BRANCH:$f" 2>/dev/null || echo "$f"
          done | xargs -r git rm -q --ignore-unmatch || true
          # Re-import our files (workflows, translations memory, ctignore).
          for p in $KEEP_FROM_ORIGIN; do
            git checkout origin/main -- "$p" 2>/dev/null || true
          done
          git rm -q --ignore-unmatch .github/workflows/release.yml 2>/dev/null || true

      - uses: actions/cache@v4
        if: needs.sync.outputs.doc != '0'
        with:
          path: .genaiscript/cache/**
          key: continuous-translation-${{ github.run_id }}
          restore-keys: |
            continuous-translation-
      - name: Translate docs to zh
        if: needs.sync.outputs.doc != '0'
        continue-on-error: true
        uses: pelikhan/action-continuous-translation@v0
        with:
          lang: zh
          files: "**/*.md*"
          debug: true
          filename_template: "{{dirname}}/{{basename}}{{extname}}"
          model_alias: |
            translation: openai:${{ vars.OPENAI_MODEL_NAME }}
            validation: openai:${{ vars.OPENAI_MODEL_NAME }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE }}
      - name: Create/Update Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: workspace
          base: main
          title: "[cai] sync upstream + translate docs to zh"
          body: |
            Automatically synced from upstream and translated to Chinese.
            - Triggered by schedule or manual dispatch.
          commit-message: "sync+translate: update from upstream"
          delete-branch: false
