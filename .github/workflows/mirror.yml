name: Sync Upstream to mirror

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync_upstream_to_mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync or create mirror branch
        run: |
          git config --global push.autoSetupRemote true
          # UPSTREAM_REPOSITORY_URL is a public repository URL
          # like: https://github.com/username/repo.git
          git remote add upstream ${{ vars.UPSTREAM_REPOSITORY_URL }}
          git fetch upstream --no-tags +main:mirror
          git switch mirror

      - name: Remove excluded files
        run: |
          # EXCLUDE_FILES is a space-separated list of file glob patterns
          if [ -z "${{ vars.EXCLUDE_FILES }}" ]; then
            echo "EXCLUDE_FILES is not set, skipping file removal" && exit 0
          fi
          for pattern in ${{ vars.EXCLUDE_FILES }}; do
            git rm -r --ignore-unmatch $pattern || true
          done

      - name: Push mirror branch if necessary
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Exclude configured files (sync at $(date '+%Y-%m-%d %H:%M:%S'))"
          push_options: "--force"
