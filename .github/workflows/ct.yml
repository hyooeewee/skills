name: Continuous Translation

on:
  push:
    branches:
      - mirror
    paths:
      - "**/*.md*"
      - "!.changeset/**"
      - "!CHANGELOG.md"
      - "!translations/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuous_translation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Make work branch
        run: |
          git config --global core.pager cat
          git remote -v
          git switch -C translation origin/mirror
          echo "${{ vars.RESTORE_PATHS }}"
          if [ -n "${{ vars.RESTORE_PATHS }}" ]; then
            git restore --source=origin/main .github/workflows/*.yml 2>/dev/null || true
            while IFS= read -r path; do
              git restore --source=origin/main "$path" 2>/dev/null || true
            done <<< "${{ vars.RESTORE_PATHS }}"
          fi
          git push -u -f origin translation
          # git branch -C translation main && git push -u -f origin main
          git status && git branch -v

      - uses: actions/cache@v4
        with:
          path: .genaiscript/cache/**
          key: continuous-translation-${{ github.run_id }}
          restore-keys: |
            continuous-translation-

      - uses: pelikhan/action-continuous-translation@v0
        continue-on-error: true
        with:
          lang: zh
          files: "./**/*.md*"
          filename_template: "{{dirname}}/{{basename}}{{extname}}"
          model_alias: |
            translation: openai:${{ vars.OPENAI_MODEL_NAME }}
            validation: openai:${{ vars.OPENAI_MODEL_NAME }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE }}

      - name: Create/Update Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: translation
          base: main
          title: "[cai] 🤖 Translate docs to zh"
          body: |
            This PR automatically updates Chinese translations.
            - Triggered by push to `mirror` branch.
          commit-message: "[cai] 🤖 translate docs to zh"
          delete-branch: false
