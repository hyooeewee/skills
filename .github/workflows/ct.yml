name: Continuous Translation

on:
  workflow_dispatch:
  push:
    branches:
      - mirror
    paths:
      - "**/*.md"
      - "!.changeset/**"
      - "!CHANGELOG.md"
      - "!translations/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuous_translation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: |
          git checkout mirror
          if git checkout translation 2>/dev/null; then
            git rebase mirror
          else
            git checkout -b translation mirror
          fi

      - uses: actions/cache@v4
        with:
          path: .genaiscript/cache/**
          key: continuous-translation-${{ github.run_id }}
          restore-keys: |
            continuous-translation-

      - name: Pull remote changes (local wins)
        run: |
          git fetch origin translation || true
          if git merge origin/translation --strategy-option=ours --no-commit 2>/dev/null; then
            git commit -m "merge remote changes (local wins)" || echo "No changes to commit"
          else
            echo "No remote changes to merge"
          fi
          if git restore --source=main .github/workflows/*.yml 2>/dev/null; then
            git add .github/workflows/*.yml 2>/dev/null
            git commit -m "restore workflow files from main" || echo "No workflow changes"
          else
            echo "No workflow files to restore"
          fi

      - uses: pelikhan/action-continuous-translation@v0
        with:
          lang: zh
          files: |
            **/*.md
          # Overwrite the original files with the translated content
          filename_template: "{{dirname}}/{{basename}}{{extname}}"
          model_alias: |
            translation: openai:${{ vars.OPENAI_MODEL_NAME }}
            validation: openai:${{ vars.OPENAI_MODEL_NAME }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE }}

      - name: Create/Update Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: translation
          base: main
          title: "[cai] 🤖 Translate docs to zh"
          body: |
            This PR automatically updates Chinese translations.
            - Triggered by push to `mirror` branch.
          commit-message: "[cai] 🤖 translate docs to zh"
          delete-branch: false
          add-paths: |
            **.md*
            translations/**
