name: Continuous Translation

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY_URL: ${{ vars.UPSTREAM_REPOSITORY_URL }}
  UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH || 'main' }}
  KEEP_FROM_ORIGIN: ".github translations .ctignore"

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      doc: ${{ steps.sync.outputs.doc }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPOSITORY_URL"
          git fetch upstream "$UPSTREAM_BRANCH" --no-tags

      - name: Detect changes
        id: sync
        run: |
          if git diff --quiet "upstream/$UPSTREAM_BRANCH" origin/main; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes. Exiting." && exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --name-only "upstream/$UPSTREAM_BRANCH" origin/main > /tmp/changed.txt
          # Not markdown -> sync raw; markdown -> translation candidates.
          grep -v -E '\.md$' /tmp/changed.txt |
            grep -v -E '^\.github/|^\.changeset/|^CHANGELOG\.md$|^translations/' |
            sort -u > /tmp/non_doc.txt || true
          grep -E '\.md$' /tmp/changed.txt | sort -u > /tmp/doc.txt || true
          echo "doc=$(wc -l < /tmp/doc.txt)" >> "$GITHUB_OUTPUT"
          echo "/tmp/non_doc.txt $(wc -l < /tmp/non_doc.txt) file(s)"
          cat /tmp/non_doc.txt
          echo "/tmp/doc.txt $(wc -l < /tmp/doc.txt) file(s)"
          cat /tmp/doc.txt

  translation:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPOSITORY_URL"
          git fetch upstream "$UPSTREAM_BRANCH" --no-tags

      - name: Prepare content from upstream
        run: |
          # Resolve the workspace workflow files from our repo, not upstream, so
          # upstream's release workflow never enters the branch.
          git checkout "upstream/$UPSTREAM_BRANCH" -- . ':!.github/workflows'
          # Delete files removed upstream.
          git ls-tree -r --name-only origin/main | while read -r f; do
            git cat-file -e "upstream/$UPSTREAM_BRANCH:$f" 2>/dev/null || echo "$f"
          done | xargs -r git rm -q --ignore-unmatch || true
          # Re-import our files (workflows, translations memory, ctignore).
          for p in $KEEP_FROM_ORIGIN; do
            git checkout origin/main -- "$p" 2>/dev/null || true
          done
          git rm -q --ignore-unmatch .github/workflows/release.yml 2>/dev/null || true

      - uses: actions/cache@v6
        if: needs.sync.outputs.doc != '0'
        with:
          path: .genaiscript/cache/**
          key: continuous-translation-${{ github.run_id }}
          restore-keys: |
            continuous-translation-

      - name: Get Secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            16aa98e0-2c29-43d3-888f-b4b400574913 > OPENAI_API_BASE
            bb9e30e3-dc05-4bf8-a079-b4b40056d6c2 > OPENAI_API_KEY
            aca6cba0-1773-426e-b78b-b4b400581b43 > OPENAI_MODEL_NAME

      - name: Translate docs to zh
        if: needs.sync.outputs.doc != '0'
        continue-on-error: true
        uses: hyooeewee/action-continuous-translation@v0
        with:
          lang: zh
          files: "**/*.md*"
          debug: true
          filename_template: "{{dirname}}/{{basename}}{{extname}}"
          instructions: |
            For EVERY ┌P###┐ or ┌T###┐ marker you MUST return exactly one fenced code block whose language is the SAME identifier (e.g. ```P001).  Never rename P to T or change the number. Do not merge, skip, reorder or omit any block. Keep all Markdown links, bold, and inline code intact; translate only the natural-language text and keep URLs unchanged.
          openai_api_base: ${{ env.OPENAI_API_BASE }}
          openai_api_key: ${{ env.OPENAI_API_KEY }}
          model_alias: |
            translation: openai:${{ env.OPENAI_MODEL_NAME }}
            validation: openai:${{ env.OPENAI_MODEL_NAME }}

      - name: Restore docs left untranslated by the translation step
        if: needs.sync.outputs.changed == 'true'
        run: |
          restored=0
          while IFS= read -r f; do
            case "$f" in
              *.md|*.mdx) ;;
              *) continue ;;
            esac
            [ -f "$f" ] || continue
            # Unchanged by the translation step, i.e. still raw upstream content?
            cmp -s "$f" <(git show "upstream/$UPSTREAM_BRANCH:$f") || continue
            # Is there an origin/main version to restore?
            git cat-file -e "origin/main:$f" 2>/dev/null || continue
            # Skip when origin/main is not a translation of upstream (no regression).
            cmp -s <(git show "origin/main:$f") <(git show "upstream/$UPSTREAM_BRANCH:$f") && continue
            echo "::notice::restoring $f (left as raw upstream English; origin/main has a translation)"
            git checkout origin/main -- "$f"
            restored=$((restored+1))
          done < <(git diff --name-only origin/main -- '*.md' '*.mdx')
          echo "restored=$restored doc(s) from origin/main"

      - name: Fix ownership of generated files
        if: needs.sync.outputs.changed == 'true'
        run: sudo chown -R runner:runner . 2>/dev/null || true

      - name: Create/Update Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: workspace
          base: main
          title: "[cai] sync upstream + translate docs to zh"
          body: |
            Automatically synced from upstream and translated to Chinese.
            - Triggered by schedule or manual dispatch.
          commit-message: "sync+translate: update from upstream"
          delete-branch: false
